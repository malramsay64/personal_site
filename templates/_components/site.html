{% component youtube(id: string, timestamp="") -%}
<div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
<iframe src="https://www.youtube-nocookie.com/embed/{{ id }}{% if timestamp %}?start={{ timestamp }}{% endif %}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" title="YouTube video" allowfullscreen></iframe>
</div>
{%- endcomponent youtube %}

{% component warning() -%}
<blockquote class="warning">
{{ body | markdown | safe }}
</blockquote>
{%- endcomponent warning %}
