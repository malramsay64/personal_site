base_url = "https://malramsay.com"
title = "Malcolm Ramsay"
description = "Data scientist writing about Python, data analysis and research software."
default_language = "en"
theme = "serene"
output_dir = "public"
compile_sass = true
minify_html = false
build_search_index = false
generate_feeds = false
feed_filenames = ["feed.xml"]
taxonomies = [{ name = "tags" }]

[markdown]
render_emoji = false
external_links_target_blank = false
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false
github_alerts = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[extra]
nav = [
  { name = "blog", path = "/post" },
  { name = "talks", path = "/talks" },
  { name = "projects", path = "/projects" },
  { name = "tags", path = "/tags" },
  { name = "github", path = "https://github.com/malramsay64" },
]

name = "Malcolm Ramsay"
links = [
  { name = "GitHub", icon = "github", url = "https://github.com/malramsay64" },
  { name = "LinkedIn", icon = "linkedin", url = "https://linkedin.com/in/malramsay64" },
  { name = "Email", icon = "email", url = "mailto:m@malramsay.com" },
]
blog_section_path = "/post"
og_image = "img/og.png"

back_link_text = "Back"
color_scheme = "auto"

footer_copyright = "© 2017–2026 Malcolm Ramsay"
footer_credits = false

not_found_error_text = "404 Not Found"
not_found_recover_text = "« back to home »"

date_format = "%Y-%m-%d"
toc = false
code_copy = true
comment = false
math = false
mermaid = false
outdated_alert = false
outdated_alert_days = 120
outdated_alert_text_before = "This article was last updated "
outdated_alert_text_after = " days ago and may be out of date."

reaction = false
reaction_align = "right"
reaction_endpoint = ""
