name: Maintenance

# Monthly bumps of security.txt expiry, footer year and Zola version.
# Opens a PR only when something changed.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Apply bumps
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'summary<<EOF'
            scripts/maintenance.sh
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # PRs opened with GITHUB_TOKEN don't trigger other workflows,
      # so check the bumped site builds before opening the PR.
      - name: Check the site still builds
        run: |
          version=$(sed -n 's/^ZOLA_VERSION = "\(.*\)"/\1/p' netlify.toml)
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${version}/zola-v${version}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin
          zola build

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/maintenance
          commit-message: "Routine maintenance bumps"
          title: "Routine maintenance bumps"
          body: |
            Automated monthly bumps:

            ```
            ${{ steps.bump.outputs.summary }}
            ```

            Check the Netlify deploy preview before merging.
          delete-branch: true
