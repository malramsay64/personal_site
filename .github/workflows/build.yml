name: Build

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a run on main part way through deploying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: $/.github/actions/setup-zola

      - name: Build site
        run: zola build

      - name: Check security.txt has not expired
        run: |
          expires=$(sed -n 's/^Expires: //p' static/.well-known/security.txt)
          if [[ $(date -u -d "$expires" +%s) -lt $(date -u +%s) ]]; then
            echo "::error file=static/.well-known/security.txt::Expired on $expires"
            exit 1
          fi

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read # check out the repository
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: $/.github/actions/setup-zola

      # Rebuilt with the same pinned Zola as the build job, rather than passed
      # between jobs as an artifact.
      - name: Build site
        run: zola build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.1 deploy
