name: Build

# Every step runs a justfile recipe, so `just ci` locally checks the same things.
on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a run on the default branch part way through deploying.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: $/.github/actions/setup-just
      - uses: $/.github/actions/setup-zola
      - uses: $/.github/actions/setup-lychee

      - name: Build site
        run: just build

      - name: Check sitemap, feed and robots.txt
        run: just check-site

      - name: Check internal links and anchors
        run: just links

      - name: Check security.txt has not expired
        run: just check-security-txt

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read # check out the repository
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: $/.github/actions/setup-just
      - uses: $/.github/actions/setup-zola

      # Rebuilds with the same pinned Zola as the build job, rather than
      # passing the site between jobs as an artifact.
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: just deploy
