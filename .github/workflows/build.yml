name: Build

on:
  push:
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-zola

      - name: Build site
        run: zola build

      - name: Check security.txt has not expired
        run: |
          expires=$(sed -n 's/^Expires: //p' static/.well-known/security.txt)
          if [[ $(date -u -d "$expires" +%s) -lt $(date -u +%s) ]]; then
            echo "::error file=static/.well-known/security.txt::Expired on $expires"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: deploy
