name: Preview

# Cloudflare Worker Previews (open beta): one preview per PR, named pr-<number>,
# updated on each push and deleted when the PR is closed or merged.
# Skipped for PRs from forks, which don't get the Cloudflare secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  WRANGLER: npx --yes wrangler@4.151.1

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-zola

      # The preview URL is only known once the preview exists, and Zola needs it
      # as the base URL. So upload once to get the URL, then rebuild and upload
      # again. Unchanged assets aren't re-uploaded, so the second pass is cheap.
      - name: Get preview URL
        id: url
        run: |
          zola build
          url=$($WRANGLER preview --name "$PREVIEW_NAME" --json | jq -r '.preview.urls[0]')
          [[ $url == https://* ]] || { echo "::error::No preview URL returned"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build and upload preview
        run: |
          zola build --base-url "${{ steps.url.outputs.url }}"
          $WRANGLER preview --name "$PREVIEW_NAME" --message "${{ github.event.pull_request.head.sha }}"

      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.url.outputs.url }}
        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';
            const body = `${marker}\nPreview: ${process.env.URL}\n\nUpdated for ${context.payload.pull_request.head.sha.slice(0, 7)}.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete preview
        run: |
          $WRANGLER preview delete --name "$PREVIEW_NAME" --skip-confirmation \
            || echo "::warning::Could not delete preview $PREVIEW_NAME (it may not exist)"
