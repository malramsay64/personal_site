name: Preview

# Cloudflare Worker Previews (open beta): one preview per PR, named pr-<number>,
# updated on each push and deleted when the PR is closed or merged.
# Skipped for PRs from forks, which don't get the Cloudflare secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  WRANGLER: npx --yes wrangler@4.151.1

jobs:
  deploy:
    name: Deploy preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      pull-requests: write # comment the preview URL on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: $/.github/actions/setup-zola

      # The preview URL is only known once the preview exists, and Zola needs it
      # as the base URL. So upload once to get the URL, then rebuild and upload
      # again. Unchanged assets aren't re-uploaded, so the second pass is cheap.
      - name: Get preview URL
        id: url
        run: |
          zola build
          url=$($WRANGLER preview --name "$PREVIEW_NAME" --json | jq -r '.preview.urls[0]')
          [[ $url == https://* ]] || { echo "::error::No preview URL returned"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build and upload preview
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        run: |
          zola build --base-url "$PREVIEW_URL"
          $WRANGLER preview --name "$PREVIEW_NAME" --message "$HEAD_SHA"

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.url.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- cloudflare-preview -->'
          body=$(printf '%s\nPreview: %s\n\nUpdated for %s.' "$marker" "$PREVIEW_URL" "${HEAD_SHA:0:7}")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)
          if [[ -n $id ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

      # Scores the preview as served by Cloudflare, with the real headers and CSP.
      # Thresholds are in .github/lighthouserc.json; the maths post also checks
      # that KaTeX loads under the CSP (blocked resources lower Best Practices).
      - name: Lighthouse
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        run: |
          npx --yes @lhci/cli@0.15.1 autorun --config=.github/lighthouserc.json \
            --collect.url="$PREVIEW_URL/" \
            --collect.url="$PREVIEW_URL/post/" \
            --collect.url="$PREVIEW_URL/post/docker-on-fedora/" \
            --collect.url="$PREVIEW_URL/post/quaternions-in-md/"

      - name: Lighthouse summary
        if: always() && steps.url.outputs.url
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, statistics
          runs = {}
          for f in glob.glob(".lighthouseci/lhr-*.json"):
              r = json.load(open(f))
              runs.setdefault(r["finalDisplayedUrl"], []).append(
                  {k: v["score"] for k, v in r["categories"].items()})
          cats = ["performance", "accessibility", "best-practices", "seo"]
          print("| Page | " + " | ".join(cats) + " |")
          print("|---|" + "---|" * len(cats))
          for url, rs in sorted(runs.items()):
              scores = [round(100 * statistics.median(r[c] for r in rs)) for c in cats]
              print(f"| {url} | " + " | ".join(map(str, scores)) + " |")
          PY

  cleanup:
    name: Delete preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Delete preview
        run: |
          $WRANGLER preview delete --worker-name malramsay-com --name "$PREVIEW_NAME" --skip-confirmation \
            || echo "::warning::Could not delete preview $PREVIEW_NAME (it may not exist)"
