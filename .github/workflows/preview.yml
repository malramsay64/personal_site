name: Preview

# Cloudflare Worker Previews (open beta): one preview per PR, named pr-<number>,
# updated on each push and deleted when the PR is closed or merged.
# Skipped for PRs from forks, which don't get the Cloudflare secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  deploy:
    name: Deploy preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      pull-requests: write # comment the preview URL on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: $/.github/actions/setup-just
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: $/.github/actions/setup-zola

      - name: Build and upload preview
        id: url
        run: |
          url=$(just preview "$PREVIEW_NAME" "$HEAD_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.url.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- cloudflare-preview -->'
          body=$(printf '%s\nPreview: %s\n\nUpdated for %s.' "$marker" "$PREVIEW_URL" "${HEAD_SHA:0:7}")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)
          if [[ -n $id ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

      # Scores the preview as served by Cloudflare, with the real headers and CSP.
      # Thresholds are in .github/lighthouserc.json. Any browser console error
      # fails it, which catches the CSP blocking KaTeX on the maths post.
      - name: Lighthouse
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        run: just lighthouse-url "$PREVIEW_URL"

      - name: Lighthouse summary
        if: always() && steps.url.outputs.url
        run: just lighthouse-summary >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Delete preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository for the justfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-just

      - name: Delete preview
        run: |
          just preview-delete "$PREVIEW_NAME" \
            || echo "::warning::Could not delete preview $PREVIEW_NAME (it may not exist)"
