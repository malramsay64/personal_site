version: 2
updates:
  # The serene theme submodule
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  # LanguageTool for the prose check
  - package-ecosystem: maven
    directory: /.github/prose
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
