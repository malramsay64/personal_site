name: Setup just
description: Install the just command runner
runs:
  using: composite
  steps:
    - shell: bash
      env:
        JUST_VERSION: 1.59.0
        JUST_SHA256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e
      run: |
        archive="just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/casey/just/releases/download/$JUST_VERSION/$archive"
        echo "$JUST_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
        sudo tar xzf "$RUNNER_TEMP/$archive" -C /usr/local/bin just
        just --version
