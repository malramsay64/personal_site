name: Setup Zola
description: Install the Zola version pinned in the justfile (needs setup-just first)
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        version=$(just --evaluate zola_version)
        curl -fsSL "https://github.com/getzola/zola/releases/download/v${version}/zola-v${version}-x86_64-unknown-linux-gnu.tar.gz" \
          | sudo tar xz -C /usr/local/bin
        zola --version
