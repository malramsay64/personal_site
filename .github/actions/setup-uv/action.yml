name: Setup uv
description: Install the uv Python package manager
runs:
  using: composite
  steps:
    - shell: bash
      env:
        UV_VERSION: 0.13.1
        UV_SHA256: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
      run: |
        archive=uv-x86_64-unknown-linux-gnu.tar.gz
        curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/$archive"
        echo "$UV_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
        sudo tar xzf "$RUNNER_TEMP/$archive" -C /usr/local/bin --strip-components=1
        uv --version
